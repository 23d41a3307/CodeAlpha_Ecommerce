<!DOCTYPE html>
<html>
<head>
    <title>My Orders</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <h2>My Orders</h2>

    {% if orders %}

        <table class="table table-bordered">

            <tr>
                <th>Name</th>
                <th>Address</th>
                <th>Phone</th>
            </tr>

            {% for order in orders %}

            <tr>
                <td>{{ order.name }}</td>
                <td>{{ order.address }}</td>
                <td>{{ order.phone }}</td>
            </tr>

            {% endfor %}

        </table>

    {% else %}

        <h4>No Orders Found.</h4>

    {% endif %}

</div>

</body>
</html>
