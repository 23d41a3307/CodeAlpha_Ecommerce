<!DOCTYPE html>
<html>
<head>
    <title>My Wishlist</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <h2>❤️ My Wishlist</h2>

    {% if items %}

        <div class="row">

        {% for item in items %}

            <div class="col-md-4">

                <div class="card mb-4">

                    {% if item.product.image %}
                        <img src="{{ item.product.image.url }}" class="card-img-top" height="250">
                    {% endif %}

                    <div class="card-body">

                        <h4>{{ item.product.name }}</h4>

                        <h5 class="text-success">
                            ₹{{ item.product.price }}
                        </h5>

                        <a href="{% url 'product_detail' item.product.id %}" class="btn btn-primary">
                            View Product
                        </a>

                    </div>

                </div>

            </div>

        {% endfor %}

        </div>

    {% else %}

        <h4>No products in your wishlist.</h4>

    {% endif %}

</div>

</body>
</html>
